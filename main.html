   <div class="container mt-5">
       <h2>Login</h2>
       <form action="login.php" method="POST">
           <div class="form-group">
               <label for="email">Email:</label>
               <input type="email" name="email" class="form-control" required>

               <label for="password">Password:</label>

       </form>
   </div>
